# Список Telegram-каналов для ежедневного дайджеста.
# Юзернейм без @, как в ссылке t.me/<username>.
# Работает и для каналов, на которые вы подписаны, и для публичных
# каналов, на которые не подписаны (подписка не требуется для чтения
# публичных каналов через Telethon).

channels:
  # Рейтинг Медиалогия (экономика/финансы по просмотрам, июнь 2026)
  - ecotopor          # Топор. Экономика
  - prostoecon         # Простая экономика
  - bankrollo          # Банки, деньги, два офшора
  - ekonomika_banki    # Деньги в Эфире
  - banksta            # Банкста
  - eco_details        # Экономика в деталях
  - ex_fin             # Финансовый Эксперт
  - financee_news      # Финансовые новости
  - markettwits        # MarketTwits
  - p_fin              # ПроФинансы
  - fin_sphere         # Финансовая Сфера
  - bezposhady         # Беспощадный Банкстер
  - vsepro_dengi       # Всё про деньги
  - eco_diary          # Дневник Экономиста

  # Авторские каналы профи с собственными тейками
  - RationalAnswer     # Павел Комаровский — инвестиции, личные финансы
  - bitkogan           # Евгений Коган — инвестбанкир, профессор ВШЭ
  - Truevalue          # Виктор Тунев — макроэкономика, ставки, MMT

  # Международные
  - Bloomberg          # официальный канал Bloomberg
  - zerohedge_official # ZeroHedge — макро/рынки
